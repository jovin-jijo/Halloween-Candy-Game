<!DOCTYPE html>
<html>
<head>
    <title>Halloween Candy Catch</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #171020;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-shell {
            width: min(100%, 420px);
            padding: 10px;
        }

        .game-wrap {
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            image-rendering: pixelated;
            touch-action: none;
        }

        #lyrics {
            position: absolute;
            bottom: 17%;
            left: 5%;
            width: 90%;
            color: white;
            text-align: center;
            font-family: "Chewy", cursive;
            font-size: clamp(15px, 3.5vw, 21px);
            text-shadow: 0 0 5px white, 0 0 15px #dcbcff;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }

        #lyrics.show { opacity: 1; }
    </style>
</head>

<body>

<div class="game-shell">
    <div class="game-wrap">
        <canvas id="game" width="160" height="240"></canvas>
        <div id="lyrics"></div>
    </div>
</div>

<audio id="music" preload="auto">
    <source src="./by%20my%20side%20(feat.%20bixby).mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const music = document.getElementById("music");
const lyricDisplay = document.getElementById("lyrics");

const lyrics = [
    [4.86, "I think I died again"],
    [7.89, "So we could stay as friends, yeah"],
    [11.07, "I think it all depends"],
    [13.47, "On the truth"],
    [17.30, "I know your friends just hate me"],
    [20.28, "They acting kind of crazy"],
    [22.03, "They always laugh and gate-keep"],
    [25.76, "But it's cool"],
    [28.30, "People, they always quick to judge"],
    [31.22, "We know, I'm never leaving ya"],
    [34.06, "Bedroom is a haven"],
    [35.62, "We put on our favorite song"],
    [40.65, "Details, the ones I'll never know"],
    [44.32, "She sells the things I'm letting go"],
    [46.46, "But, way to push my luck"],
    [48.86, "I've been alive when you talk like you do"],
    [51.50, "I could cry"],
    [54.31, "Every time I'm asking why"],
    [57.19, "You've been always by my side"],
    [59.51, "Again, again"],
    [60.23, "Too in love to be just friends 'cause"],
    [64.53, "I won't lie"],
    [66.51, "You've been always on my mind"],
    [69.56, "You've been always by my side"],
    [71.86, "Again, again"],
    [72.78, "Too in love to be just friends 'cause"],
    [77.08, "Your hearts grown weak"],
    [78.62, "Enough to keep me your dirty little secret"],
    [83.01, "When you last saw me, baby I couldn't speak"],
    [86.37, "Oh, you'd never really mean that"],
    [88.97, "Oh, when you're far from me"],
    [90.85, "It becomes so easy to figure it out"],
    [93.83, "So, fine"],
    [94.71, "I know your waiting for"],
    [96.72, "I don't wanna fall"],
    [97.36, "Oh baby you're the one for me"],
    [101.98, "I could cry"],
    [103.84, "Every time I'm asking why"],
    [106.72, "You've been always by my side"],
    [109.04, "Again, again"],
    [109.78, "Too in love to be just friends 'cause"],
    [114.05, "I won't lie"],
    [116.07, "You've been always on my mind"],
    [119.11, "You've been always by my side"],
    [121.43, "Again, again"],
    [122.17, "Too in love to be just friends 'cause"],
    [138.56, "(Yeah my hearts got weak I know)"],
    [141.61, "(Saying I should let things go)"],
    [144.52, "(But my time)"],
    [145.07, "(Got me crying)"],
    [154.47, "I could cry"],
    [155.59, "Every time I'm asking why"],
    [159.38, "You've been always by my side"],
    [161.60, "Again, again"],
    [162.60, "Too in love to be just friends 'cause"],
    [166.58, "I won't lie"],
    [168.70, "You've been always on my mind"],
    [171.74, "You've been always by my side"],
    [174.09, "Again, again"],
    [174.78, "Too in love to be just friends 'cause"]
];

const GAME_LENGTH = 60;
const MAX_MISSES = 20;

let player = 68;
let score = 0;
let misses = 0;
let items = [];
let keys = {};
let started = false;
let gameOver = false;
let elapsed = 0;
let spawnTimer = 0;
let boostTimer = 0;
let currentLyric = -1;
let lastFrame = 0;

music.volume = 0.5;

function startGame() {
    if (started || gameOver) return;

    started = true;
    music.currentTime = 0;
    music.play().catch(() => {});
}

function reset() {
    player = 68;
    score = 0;
    misses = 0;
    items = [];
    elapsed = 0;
    spawnTimer = 0;
    boostTimer = 0;
    currentLyric = -1;
    started = false;
    gameOver = false;

    lyricDisplay.textContent = "";
    lyricDisplay.classList.remove("show");

    music.pause();
    music.currentTime = 0;
    startGame();
}

function finishGame() {
    gameOver = true;
    music.pause();
    lyricDisplay.classList.remove("show");
}

window.onkeydown = e => {
    keys[e.key] = true;

    if (e.key === " " || e.key.startsWith("Arrow")) {
        e.preventDefault();
    }

    if (e.key === " " && gameOver) reset();
    else if (e.key === " " && !started) startGame();
};

window.onkeyup = e => {
    keys[e.key] = false;
};

canvas.onclick = () => {
    if (gameOver) reset();
    else if (!started) startGame();
};

canvas.onpointermove = e => {
    if (!started || gameOver) return;

    const rect = canvas.getBoundingClientRect();
    player = Math.max(0, Math.min(136,
        (e.clientX - rect.left) * 160 / rect.width - 12
    ));
};

function spawnCandy() {
    let powerup = Math.random() < 0.035;
    let poison = !powerup && Math.random() < 0.12;
    let colors = ["#e98c86", "#e9ad67", "#91bba0"];

    items.push({
        x: Math.random() * 148,
        y: -10,
        color: powerup ? "#f6ce76" : poison ? "#a77bd1" : colors[Math.floor(Math.random() * 3)],
        powerup,
        poison
    });
}

function updateLyrics() {
    let index = -1;

    for (let i = 0; i < lyrics.length; i++) {
        if (music.currentTime >= lyrics[i][0]) index = i;
        else break;
    }

    if (index !== currentLyric) {
        currentLyric = index;
        lyricDisplay.textContent = index >= 0 ? lyrics[index][1] : "";
        lyricDisplay.classList.toggle("show", index >= 0);

        if (index >= 0) spawnCandy();
    }
}

function background() {
    ctx.fillStyle = "#39283e";
    ctx.fillRect(0, 0, 160, 240);

    ctx.fillStyle = "#765064";
    ctx.fillRect(0, 130, 160, 110);

    ctx.fillStyle = "#f3c58d";
    ctx.fillRect(124, 49, 14, 14);

    ctx.fillStyle = "#21172b";
    ctx.fillRect(0, 180, 160, 60);

    ctx.fillStyle = "#39283e";
    ctx.fillRect(8, 157, 28, 23);
    ctx.fillRect(47, 164, 22, 16);
    ctx.fillRect(105, 153, 25, 27);
    ctx.fillRect(137, 165, 23, 15);

    ctx.fillStyle = "#e8d8e9";

    [[14,48],[38,68],[70,42],[99,78],[19,112],
     [58,91],[146,96],[86,120],[132,132]].forEach(p => {
        ctx.fillRect(p[0], p[1], 2, 2);
    });
}

function drawPlayer() {
    ctx.fillStyle = "#526b43";
    ctx.fillRect(player + 10, 203, 5, 5);

    ctx.fillStyle = "#b85b32";
    ctx.fillRect(player + 4, 207, 16, 13);

    ctx.fillStyle = "#e9873f";
    ctx.fillRect(player + 2, 210, 20, 8);
    ctx.fillRect(player + 5, 206, 14, 15);

    ctx.fillStyle = "#f5a34f";
    ctx.fillRect(player + 8, 207, 2, 13);
    ctx.fillRect(player + 14, 207, 2, 13);

    ctx.fillStyle = "#573044";
    ctx.fillRect(player + 7, 212, 3, 3);
    ctx.fillRect(player + 15, 212, 3, 3);
    ctx.fillRect(player + 10, 217, 5, 2);
}

function drawItem(item) {
    ctx.fillStyle = item.color;
    ctx.fillRect(item.x + 2, item.y + 1, 6, 6);

    if (item.powerup) {
        ctx.fillStyle = "#75502f";
        ctx.font = "6px monospace";
        ctx.fillText("2X", item.x, item.y + 6);
    } else {
        ctx.fillStyle = "#f8d9c5";
        ctx.fillRect(item.x, item.y + 3, 2, 2);
        ctx.fillRect(item.x + 8, item.y + 3, 2, 2);
    }
}

function drawHUD() {
    ctx.fillStyle = "#f5e5d5";
    ctx.font = "7px monospace";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + score, 7, 12);

    ctx.textAlign = "center";
    ctx.fillText("TIME " + Math.ceil(GAME_LENGTH - elapsed), 80, 12);

    ctx.textAlign = "right";
    ctx.fillText("MISS " + misses + "/" + MAX_MISSES, 153, 12);

    ctx.fillStyle = "#ffffff33";
    ctx.fillRect(7, 18, 146, 2);

    ctx.fillStyle = "#e9a477";
    ctx.fillRect(7, 18, 146 * elapsed / GAME_LENGTH, 2);

    if (boostTimer > 0) {
        ctx.fillStyle = "#f6ce76";
        ctx.fillText("2X ACTIVE", 153, 31);
    }

    ctx.textAlign = "left";
}

function drawStartScreen() {
    ctx.fillStyle = "#191022cc";
    ctx.fillRect(12, 82, 136, 77);

    ctx.textAlign = "center";
    ctx.fillStyle = "#f1c69b";
    ctx.font = "bold 12px monospace";
    ctx.fillText("CANDY CATCH", 80, 105);

    ctx.font = "7px monospace";
    ctx.fillStyle = "#e9b4a4";
    ctx.fillText("A LITTLE HALLOWEEN GAME", 80, 118);

    ctx.fillStyle = "#f5e5d5";
    ctx.fillText("CLICK TO START", 80, 139);
    ctx.fillText("ARROWS / A-D TO MOVE", 80, 150);

    ctx.textAlign = "left";
}

function drawGameOver() {
    ctx.fillStyle = "#130c1be8";
    ctx.fillRect(0, 0, 160, 240);

    ctx.textAlign = "center";
    ctx.fillStyle = elapsed >= GAME_LENGTH ? "#f6ce76" : "#e99a91";
    ctx.font = "bold 14px monospace";
    ctx.fillText(elapsed >= GAME_LENGTH ? "LEVEL CLEAR!" : "GAME OVER", 80, 84);

    ctx.fillStyle = "#f5e5d5";
    ctx.font = "8px monospace";
    ctx.fillText("SCORE " + score, 80, 115);
    ctx.fillText("MISSES " + misses, 80, 132);
    ctx.fillText("CLICK TO PLAY AGAIN", 80, 174);

    ctx.textAlign = "left";
}

function draw() {
    background();

    items.forEach(drawItem);
    drawPlayer();
    drawHUD();

    if (!started && !gameOver) drawStartScreen();
    if (gameOver) drawGameOver();
}

function update(dt) {
    if (!started || gameOver) return;

    elapsed += dt;

    if (elapsed >= GAME_LENGTH) {
        elapsed = GAME_LENGTH;
        finishGame();
        return;
    }

    if (keys.ArrowLeft || keys.a || keys.A) player -= 150 * dt;
    if (keys.ArrowRight || keys.d || keys.D) player += 150 * dt;

    player = Math.max(0, Math.min(136, player));

    boostTimer = Math.max(0, boostTimer - dt);

    spawnTimer += dt;

    let interval = Math.max(0.32, 0.95 - elapsed / GAME_LENGTH * 0.52);

    if (spawnTimer >= interval) {
        spawnTimer = 0;
        spawnCandy();
    }

    for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];

        item.y += 65 * dt * (boostTimer > 0 ? 1.15 : 1);

        if (item.y >= 200 && item.x + 10 >= player && item.x <= player + 24) {
            if (item.powerup) {
                boostTimer = 6;
            } else if (item.poison) {
                misses++;
            } else {
                score += boostTimer > 0 ? 2 : 1;
            }

            items.splice(i, 1);
        } else if (item.y > 240) {
            if (!item.poison && !item.powerup) misses++;
            items.splice(i, 1);
        }

        if (misses >= MAX_MISSES) {
            finishGame();
            break;
        }
    }
}

function game(timestamp) {
    let dt = Math.min((timestamp - lastFrame) / 1000, 0.05);
    lastFrame = timestamp;

    update(dt);

    if (started && !gameOver) updateLyrics();

    draw();
    requestAnimationFrame(game);
}

game();
</script>

</body>
</html>
