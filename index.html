
<!DOCTYPE html>
<html>
<head>
    <title>Halloween Candy Catch</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #171020;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .game-shell {
            width: min(100%, 420px);
            padding: 10px;
        }

        .game-wrap {
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            touch-action: none;
        }

        #lyrics {
            position: absolute;
            bottom: 17%;
            left: 6%;
            width: 88%;
            padding: 7px 5px;
            color: white;
            text-align: center;
            font-family: "Chewy", cursive;
            font-size: clamp(15px, 3.5vw, 21px);
            line-height: 1.3;
            text-shadow:
                0 0 3px #fff,
                0 0 8px rgba(255, 255, 255, 0.9),
                0 0 17px rgba(221, 190, 255, 0.8),
                0 0 28px rgba(221, 190, 255, 0.5);
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
        }

        #lyrics.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="game-shell">
    <div class="game-wrap">
        <canvas id="game" width="160" height="240"></canvas>
        <div id="lyrics"></div>
    </div>
</div>

<audio id="music" preload="auto">
    <source src="./by%20my%20side%20(feat.%20bixby).mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const music = document.getElementById("music");
const lyricDisplay = document.getElementById("lyrics");

const lyrics = [
    { time: 4.86, text: "I think I died again" },
    { time: 7.89, text: "So we could stay as friends, yeah" },
    { time: 11.07, text: "I think it all depends" },
    { time: 13.47, text: "On the truth" },
    { time: 17.30, text: "I know your friends just hate me" },

    { time: 22.03, text: "They always laugh and gate-keep" },
    { time: 25.76, text: "But it's cool" },
    { time: 28.30, text: "People, they always quick to judge" },
    { time: 31.22, text: "We know, I'm never leaving ya" },
    { time: 34.06, text: "Bedroom is a haven" },
    { time: 35.62, text: "We put on our favorite song" },
    { time: 40.65, text: "Details, the ones I'll never know" },

    { time: 59.51, text: "Again, again" },
    { time: 60.23, text: "Too in love to be just friends 'cause" },

    { time: 69.56, text: "You've been always by my side" },
    { time: 71.86, text: "Again, again" },
    { time: 72.78, text: "Too in love to be just friends 'cause" },
    { time: 77.08, text: "Your hearts grown weak" },
    { time: 78.62, text: "Enough to keep me your dirty little secret" },
    { time: 83.01, text: "When you last saw me, baby I couldn't speak" },
    { time: 86.37, text: "Oh, you'd never really mean that" },
    { time: 88.97, text: "Oh, when you're far from me" },
    { time: 90.85, text: "It becomes so easy to figure it out" },
    { time: 93.83, text: "So, fine" },
    { time: 94.71, text: "I know your waiting for" },
    { time: 96.72, text: "I don't wanna fall" },
    { time: 97.36, text: "Oh baby you're the one for me" },
    { time: 101.98, text: "I could cry" },
    { time: 103.84, text: "Every time I'm asking why" },
    { time: 106.72, text: "You've been always by my side" },
    { time: 109.04, text: "Again, again" },
    { time: 109.78, text: "Too in love to be just friends 'cause" },
    { time: 114.05, text: "I won't lie" },
    { time: 116.07, text: "You've been always on my mind" },
    { time: 119.11, text: "You've been always by my side" },
    { time: 121.43, text: "Again, again" },
    { time: 122.17, text: "Too in love to be just friends 'cause" },
    { time: 138.56, text: "(Yeah my hearts got weak I know)" },
    { time: 141.61, text: "(Saying I should let things go)" },
    { time: 144.52, text: "(But my time)" },
    { time: 145.07, text: "(Got me crying)" },
    { time: 154.47, text: "I could cry" },
    { time: 155.59, text: "Every time I'm asking why" },
    { time: 159.38, text: "You've been always by my side" },
    { time: 161.60, text: "Again, again" },
    { time: 162.60, text: "Too in love to be just friends 'cause" },
    { time: 166.58, text: "I won't lie" },
    { time: 168.70, text: "You've been always on my mind" },
    { time: 171.74, text: "You've been always by my side" },
    { time: 174.09, text: "Again, again" },
    { time: 174.78, text: "Too in love to be just friends 'cause" }
];

let player = 68;
let score = 0;
let misses = 0;
let keys = {};
let combo = 0;
let bestCombo = 0;
let items = [];
let gameOver = false;
let started = false;
let currentLyric = -1;
let elapsed = 0;
let spawnTimer = 0;
let boostTimer = 0;
let lastFrame = 0;
let won = false;

const GAME_LENGTH = 60;
const MAX_MISSES = 20;

music.volume = 0.5;

window.onkeydown = function(e) {
    keys[e.key] = true;

    if (e.key === " " || e.key.startsWith("Arrow")) {
        e.preventDefault();
    }

    if (e.key === " " && !started && !gameOver) {
        startGame();
    } else if (gameOver && e.key === " ") {
        reset();
    }
};

window.onkeyup = function(e) {
    keys[e.key] = false;
};

function startGame() {
    if (started || gameOver) return;

    started = true;
    music.currentTime = 0;

    music.play().catch(function(error) {
        console.error("Audio playback error:", error);
    });
}

function reset() {
    player = 68;
    score = 0;
    misses = 0;
    combo = 0;
    bestCombo = 0;
    items = [];
    gameOver = false;
    started = false;
    currentLyric = -1;
    elapsed = 0;
    spawnTimer = 0;
    boostTimer = 0;
    won = false;

    lyricDisplay.textContent = "";
    lyricDisplay.classList.remove("show");

    music.pause();
    music.currentTime = 0;

    startGame();
}

canvas.onclick = function() {
    if (gameOver) {
        reset();
    } else if (!started) {
        startGame();
    }
};

canvas.addEventListener("pointermove", function(e) {
    if (!started || gameOver) return;

    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    const x = (e.clientX - rect.left) * scale;

    player = Math.max(0, Math.min(136, x - 12));
});

music.onended = function() {
    if (!gameOver) finishGame(elapsed >= GAME_LENGTH);
};

function finishGame(completed) {
    gameOver = true;
    won = completed;
    music.pause();
    lyricDisplay.classList.remove("show");
}

function spawnCandy() {
    const powerup = Math.random() < 0.035;
    const poison = !powerup && Math.random() < 0.12;

    items.push({
        x: Math.random() * 148,
        y: -10,
        color: powerup ? "#f6ce76" : poison ? "#a77bd1" :
            ["#e98c86", "#e9ad67", "#91bba0"][
                Math.floor(Math.random() * 3)
            ],
        poison: poison,
        powerup: powerup
    });
}

function updateLyrics() {
    let index = -1;

    for (let i = 0; i < lyrics.length; i++) {
        if (music.currentTime >= lyrics[i].time) {
            index = i;
        } else {
            break;
        }
    }

    if (index !== currentLyric) {
        currentLyric = index;

        if (index >= 0) {
            lyricDisplay.classList.remove("show");
            lyricDisplay.textContent = lyrics[index].text;

            requestAnimationFrame(() => {
                lyricDisplay.classList.add("show");
            });

            spawnCandy();
        } else {
            lyricDisplay.classList.remove("show");
            lyricDisplay.textContent = "";
        }
    }
}

function background() {
    const g = ctx.createLinearGradient(0, 0, 0, 240);
    g.addColorStop(0, "#21172f");
    g.addColorStop(0.55, "#49334f");
    g.addColorStop(1, "#765064");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 160, 240);

    ctx.fillStyle = "rgba(255, 222, 185, 0.08)";
    ctx.fillRect(0, 45, 160, 1);

    ctx.fillStyle = "#f3c58d";
    ctx.fillRect(122, 49, 16, 16);
    ctx.fillRect(126, 45, 8, 24);
    ctx.fillRect(118, 53, 24, 8);

    ctx.fillStyle = "#fff0d9";
    ctx.fillRect(126, 53, 8, 8);

    ctx.fillStyle = "#e8d8e9";
    const stars = [
        [14, 48], [38, 68], [70, 42], [99, 78],
        [19, 112], [58, 91], [146, 96], [86, 120],
        [11, 145], [132, 132], [45, 154]
    ];

    for (const star of stars) {
        ctx.fillRect(star[0], star[1], 1, 1);
    }

    ctx.fillStyle = "#39283e";
    ctx.fillRect(0, 174, 160, 66);
    ctx.fillRect(7, 154, 29, 20);
    ctx.fillRect(12, 140, 19, 14);
    ctx.fillRect(47, 164, 22, 10);
    ctx.fillRect(105, 158, 24, 16);
    ctx.fillRect(111, 143, 12, 15);
    ctx.fillRect(137, 166, 23, 8);

    ctx.fillStyle = "#574052";
    ctx.fillRect(15, 160, 3, 4);
    ctx.fillRect(25, 160, 3, 4);
    ctx.fillRect(113, 151, 3, 4);
    ctx.fillRect(119, 151, 3, 4);

    ctx.fillStyle = "#21172b";
    ctx.fillRect(0, 200, 160, 40);

    ctx.fillStyle = "#503649";
    ctx.fillRect(0, 198, 160, 2);

    ctx.fillStyle = "#d18d73";
    ctx.fillRect(17, 205, 2, 2);
    ctx.fillRect(140, 215, 2, 2);
    ctx.fillRect(75, 225, 2, 2);
}

function drawPlayer() {
    ctx.fillStyle = "#a94e3e";
    ctx.fillRect(player + 2, 211, 20, 9);

    ctx.fillStyle = "#e98c61";
    ctx.fillRect(player + 4, 210, 16, 9);

    ctx.fillStyle = "#f4b17c";
    ctx.fillRect(player + 7, 211, 10, 2);

    ctx.fillStyle = "#38202c";
    ctx.fillRect(player + 7, 214, 3, 2);
    ctx.fillRect(player + 15, 214, 3, 2);
    ctx.fillRect(player + 9, 218, 7, 2);

    ctx.fillStyle = "#6d432f";
    ctx.fillRect(player + 11, 207, 2, 4);

    ctx.fillStyle = "#b6c69a";
    ctx.fillRect(player + 12, 206, 3, 2);
}

function drawItem(item) {
    if (item.powerup) {
        ctx.fillStyle = "#f6ce76";
        ctx.fillRect(item.x, item.y, 10, 8);

        ctx.fillStyle = "#75502f";
        ctx.font = "6px monospace";
        ctx.fillText("2X", item.x + 1, item.y + 6);
        return;
    }

    ctx.fillStyle = item.color;
    ctx.fillRect(item.x + 2, item.y + 1, 5, 6);

    ctx.fillStyle = "#f8d9c5";
    ctx.fillRect(item.x, item.y + 3, 2, 2);
    ctx.fillRect(item.x + 7, item.y + 3, 2, 2);

    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.fillRect(item.x + 3, item.y + 2, 2, 1);
}

function drawHUD() {
    ctx.fillStyle = "#f5e5d5";
    ctx.font = "7px monospace";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + score, 7, 12);

    ctx.textAlign = "center";
    ctx.fillText("TIME " + Math.ceil(GAME_LENGTH - elapsed), 80, 12);

    ctx.textAlign = "right";
    ctx.fillText("MISS " + misses + "/" + MAX_MISSES, 153, 12);

    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.fillRect(7, 18, 146, 2);

    ctx.fillStyle = "#e9a477";
    ctx.fillRect(7, 18, 146 * (elapsed / GAME_LENGTH), 2);

    if (combo >= 2) {
        ctx.textAlign = "left";
        ctx.fillStyle = "#f4c78f";
        ctx.fillText("COMBO x" + combo, 7, 31);
    }

    if (boostTimer > 0) {
        ctx.textAlign = "right";
        ctx.fillStyle = "#f6ce76";
        ctx.fillText("2X ACTIVE", 153, 31);
    }

    ctx.textAlign = "left";
}

function drawStartScreen() {
    ctx.fillStyle = "rgba(25, 16, 34, 0.72)";
    ctx.fillRect(12, 82, 136, 77);

    ctx.fillStyle = "#f1c69b";
    ctx.textAlign = "center";
    ctx.font = "bold 12px monospace";
    ctx.fillText("CANDY CATCH", 80, 105);

    ctx.fillStyle = "#e9b4a4";
    ctx.font = "7px monospace";
    ctx.fillText("A LITTLE HALLOWEEN GAME", 80, 118);

    ctx.fillStyle = "#f5e5d5";
    ctx.fillText("CLICK TO START", 80, 139);
    ctx.fillText("ARROWS / A-D TO MOVE", 80, 150);

    ctx.textAlign = "left";
}

function drawGameOver() {
    ctx.fillStyle = "rgba(19, 12, 27, 0.91)";
    ctx.fillRect(0, 0, 160, 240);

    ctx.textAlign = "center";

    ctx.fillStyle = won ? "#f6ce76" : "#e99a91";
    ctx.font = "bold 14px monospace";
    ctx.fillText(won ? "LEVEL CLEAR!" : "GAME OVER", 80, 84);

    ctx.fillStyle = "#f5e5d5";
    ctx.font = "8px monospace";
    ctx.fillText("SCORE  " + score, 80, 111);
    ctx.fillText("BEST COMBO  " + bestCombo, 80, 127);
    ctx.fillText("MISSES  " + misses, 80, 143);

    ctx.fillStyle = "#e9b4a4";
    ctx.fillText("CLICK TO PLAY AGAIN", 80, 174);

    ctx.textAlign = "left";
}

function draw() {
    background();

    for (const item of items) {
        drawItem(item);
    }

    drawPlayer();
    drawHUD();

    if (!started && !gameOver) {
        drawStartScreen();
    }

    if (gameOver) {
        drawGameOver();
    }
}

function update(dt) {
    if (gameOver || !started) return;

    elapsed += dt;

    if (elapsed >= GAME_LENGTH) {
        elapsed = GAME_LENGTH;
        finishGame(true);
        return;
    }

    const difficulty = Math.min(elapsed / GAME_LENGTH, 1);
    const boosted = boostTimer > 0;

    boostTimer = Math.max(0, boostTimer - dt);

    const moveSpeed = 150;

    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
        player -= moveSpeed * dt;
    }

    if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
        player += moveSpeed * dt;
    }

    player = Math.max(0, Math.min(136, player));

    const spawnInterval = Math.max(
        0.32,
        0.95 - difficulty * 0.52 - (boosted ? 0.18 : 0)
    );

    spawnTimer += dt;

    while (spawnTimer >= spawnInterval) {
        spawnTimer -= spawnInterval;
        spawnCandy();

        if (difficulty > 0.55 && Math.random() < 0.25) {
            spawnCandy();
        }
    }

    const fallSpeed = 48 + difficulty * 48;

    for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];

        item.y += fallSpeed * (boosted ? 1.15 : 1) * dt;

        if (
            item.y >= 200 &&
            item.x + 10 >= player &&
            item.x <= player + 24
        ) {
            if (item.powerup) {
                boostTimer = 6;
            } else if (item.poison) {
                combo = 0;
                misses++;
            } else {
                combo++;
                bestCombo = Math.max(bestCombo, combo);
                score += boosted ? 2 : 1;

                if (combo % 5 === 0) {
                    score += 5;
                }
            }

            items.splice(i, 1);
        } else if (item.y > 240) {
            if (!item.poison && !item.powerup) {
                misses++;
                combo = 0;
            }

            items.splice(i, 1);
        }

        if (misses >= MAX_MISSES) {
            finishGame(false);
            break;
        }
    }
}

function game(timestamp) {
    if (!lastFrame) lastFrame = timestamp;

    const dt = Math.min((timestamp - lastFrame) / 1000, 0.05);
    lastFrame = timestamp;

    update(dt);

    if (started && !gameOver) {
        updateLyrics();
    }

    draw();
    requestAnimationFrame(game);
}

game();
</script>

</body>
</html>
