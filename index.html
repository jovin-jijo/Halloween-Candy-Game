
<!DOCTYPE html>
<html>
<head>
    <title>Halloween Candy Catch</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f0a1c;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .game-wrap {
            position: relative;
            width: min(100vw, 66.6667vh);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            border: 2px solid #332044;
            touch-action: none;
        }

        .game-controls {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 5;
        }

        .game-controls button {
            background: #332044;
            color: white;
            border: 1px solid #8b579e;
            border-radius: 5px;
            padding: 4px 7px;
            cursor: pointer;
            font-size: 12px;
        }

        .game-controls input {
            width: 65px;
            accent-color: #ff9b35;
        }

        #lyrics {
            position: absolute;
            bottom: 20%;
            left: 5%;
            width: 90%;
            text-align: center;
            color: white;
            font-size: clamp(12px, 3vw, 19px);
            font-weight: 600;
            line-height: 1.4;
            text-shadow: 0 0 5px white, 0 0 12px rgba(255,180,220,0.6);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        #lyrics.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="game-wrap">
    <canvas id="game" width="160" height="240"></canvas>
    <div id="lyrics"></div>

    <div class="game-controls">
        <button id="muteBtn">🔊</button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.5">
    </div>
</div>

<audio id="music" preload="auto">
    <source src="./by%20my%20side%20(feat.%20bixby).mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const music = document.getElementById("music");
const lyricDisplay = document.getElementById("lyrics");
const volumeSlider = document.getElementById("volumeSlider");
const muteBtn = document.getElementById("muteBtn");

const lyrics = [
    { time: 4.86, text: "I think I died again" },
    { time: 7.89, text: "So we could stay as friends, yeah" },
    { time: 11.07, text: "I think it all depends" },
    { time: 13.47, text: "On the truth" },
    { time: 17.30, text: "I know your friends just hate me" },
    { time: 20.28, text: "They acting kind of crazy" },
    { time: 22.03, text: "They always laugh and gate-keep" },
    { time: 25.76, text: "But it's cool" },
    { time: 28.30, text: "People, they always quick to judge" },
    { time: 31.22, text: "We know, I'm never leaving ya" },
    { time: 34.06, text: "Bedroom is a haven" },
    { time: 35.62, text: "We put on our favorite song" },

    { time: 72.78, text: "Too in love to be just friends 'cause" },
    { time: 77.08, text: "Your hearts grown weak" },
    { time: 78.62, text: "Enough to keep me your dirty little secret" },
    { time: 83.01, text: "When you last saw me, baby I couldn't speak" },
    { time: 86.37, text: "Oh, you'd never really mean that" },
    { time: 88.97, text: "Oh, when you're far from me" },
    { time: 90.85, text: "It becomes so easy to figure it out" },
    { time: 93.83, text: "So, fine" },
    { time: 94.71, text: "I know your waiting for" },
    { time: 96.72, text: "I don't wanna fall" },
    { time: 97.36, text: "Oh baby you're the one for me" },
    { time: 101.98, text: "I could cry" },
    { time: 103.84, text: "Every time I'm asking why" },
    { time: 106.72, text: "You've been always by my side" },
    { time: 109.04, text: "Again, again" },
    { time: 109.78, text: "Too in love to be just friends 'cause" },
    { time: 114.05, text: "I won't lie" },
    { time: 116.07, text: "You've been always on my mind" },
    { time: 119.11, text: "You've been always by my side" },
    { time: 121.43, text: "Again, again" },
    { time: 122.17, text: "Too in love to be just friends 'cause" },
    { time: 138.56, text: "(Yeah my hearts got weak I know)" },
    { time: 141.61, text: "(Saying I should let things go)" },
    { time: 144.52, text: "(But my time)" },
    { time: 145.07, text: "(Got me crying)" },
    { time: 154.47, text: "I could cry" },
    { time: 155.59, text: "Every time I'm asking why" },
    { time: 159.38, text: "You've been always by my side" },
    { time: 161.60, text: "Again, again" },
    { time: 162.60, text: "Too in love to be just friends 'cause" },
    { time: 166.58, text: "I won't lie" },
    { time: 168.70, text: "You've been always on my mind" },
    { time: 171.74, text: "You've been always by my side" },
    { time: 174.09, text: "Again, again" },
    { time: 174.78, text: "Too in love to be just friends 'cause"
];

let player = 68;
let score = 0;
let misses = 0;
let combo = 0;
let bestCombo = 0;
let items = [];
let gameOver = false;
let started = false;
let currentLyric = -1;
let elapsed = 0;
let spawnTimer = 0;
let boostTimer = 0;
let lastFrame = 0;
let flash = 0;
let won = false;

const GAME_LENGTH = 60;
const MAX_MISSES = 20;

music.volume = 0.5;

volumeSlider.addEventListener("input", function() {
    music.volume = Number(this.value);
    music.muted = false;
    muteBtn.textContent = music.volume === 0 ? "🔇" : "🔊";
});

muteBtn.addEventListener("click", function() {
    music.muted = !music.muted;
    this.textContent = music.muted ? "🔇" : "🔊";
});

music.addEventListener("error", function() {
    console.error("Audio could not load. Check the MP3 filename and location.");
});

window.onkeydown = function(e) {
    keys[e.key] = true;

    if (e.key === " " || e.key.startsWith("Arrow")) {
        e.preventDefault();
    }

    if (e.key === " " && !started && !gameOver) {
        startGame();
    } else if (gameOver && e.key === " ") {
        reset();
    }
};

window.onkeyup = function(e) {
    keys[e.key] = false;
};

function startGame() {
    if (started || gameOver) return;

    started = true;
    music.currentTime = 0;

    music.play().catch(function(error) {
        console.error("Audio playback error:", error);
    });
}

function reset() {
    player = 68;
    score = 0;
    misses = 0;
    combo = 0;
    bestCombo = 0;
    items = [];
    gameOver = false;
    started = false;
    currentLyric = -1;
    elapsed = 0;
    spawnTimer = 0;
    boostTimer = 0;
    flash = 0;
    won = false;

    lyricDisplay.textContent = "";
    lyricDisplay.classList.remove("show");

    music.pause();
    music.currentTime = 0;

    startGame();
}

canvas.onclick = function() {
    if (gameOver) {
        reset();
    } else if (!started) {
        startGame();
    }
};

canvas.addEventListener("pointermove", function(e) {
    if (!started || gameOver) return;

    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    const x = (e.clientX - rect.left) * scale;

    player = Math.max(0, Math.min(136, x - 12));
});

music.onended = function() {
    if (!gameOver) finishGame(elapsed >= GAME_LENGTH);
};

function finishGame(completed) {
    gameOver = true;
    won = completed;
    music.pause();
    lyricDisplay.classList.remove("show");
}

function spawnCandy() {
    const powerup = Math.random() < 0.035;
    const poison = !powerup && Math.random() < 0.12;

    items.push({
        x: Math.random() * 148,
        y: -10,
        color: powerup ? "#ffd700" : poison ? "#9922ee" :
            ["#ff2255", "#ffaa00", "#00cc55"][
                Math.floor(Math.random() * 3)
            ],
        poison: poison,
        powerup: powerup
    });
}

function updateLyrics() {
    let index = -1;

    for (let i = 0; i < lyrics.length; i++) {
        if (music.currentTime >= lyrics[i].time) {
            index = i;
        } else {
            break;
        }
    }

    if (index !== currentLyric) {
        currentLyric = index;

        if (index >= 0) {
            lyricDisplay.classList.remove("show");
            lyricDisplay.textContent = lyrics[index].text;

            requestAnimationFrame(() => {
                lyricDisplay.classList.add("show");
            });

            spawnCandy();
            flash = 0.35;
            return true;
        } else {
            lyricDisplay.classList.remove("show");
            lyricDisplay.textContent = "";
        }
    }

    return false;
}

function background() {
    let g = ctx.createLinearGradient(0, 0, 0, 240);
    g.addColorStop(0, "#1a0933");
    g.addColorStop(1, "#781c4e");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 160, 240);

    ctx.fillStyle = "#ffa927";
    ctx.fillRect(125, 25, 14, 14);

    ctx.fillStyle = "white";

    let stars = [[15,20], [40,60], [75,15], [100,50], [25,100]];

    for (let star of stars) {
        ctx.fillRect(star[0], star[1], 1, 1);
    }

    ctx.fillStyle = "#08030f";
    ctx.fillRect(0, 200, 160, 40);
    ctx.fillRect(15, 165, 30, 35);
    ctx.fillRect(20, 145, 20, 20);
    ctx.fillRect(85, 192, 6, 8);
    ctx.fillRect(125, 190, 7, 10);

    if (flash > 0) {
        ctx.fillStyle = "rgba(255,255,255," + flash * 0.18 + ")";
        ctx.fillRect(0, 0, 160, 240);
    }
}

function drawPlayer() {
    ctx.fillStyle = "#e65c00";
    ctx.fillRect(player + 2, 210, 20, 10);

    ctx.fillStyle = "#ff7700";
    ctx.fillRect(player + 4, 211, 16, 8);

    ctx.fillStyle = "black";
    ctx.fillRect(player + 6, 213, 3, 2);
    ctx.fillRect(player + 15, 213, 3, 2);
    ctx.fillRect(player + 8, 217, 8, 2);

    ctx.fillStyle = "#3a1e05";
    ctx.fillRect(player + 11, 207, 2, 3);
}

function drawItem(item) {
    if (item.powerup) {
        ctx.fillStyle = "#ffd700";
        ctx.fillRect(item.x, item.y, 10, 8);

        ctx.fillStyle = "#442500";
        ctx.font = "6px monospace";
        ctx.fillText("2X", item.x + 1, item.y + 6);
        return;
    }

    ctx.fillStyle = item.color;
    ctx.fillRect(item.x + 2, item.y + 2, 4, 4);

    ctx.fillStyle = "white";
    ctx.fillRect(item.x, item.y + 3, 2, 2);
    ctx.fillRect(item.x + 6, item.y + 3, 2, 2);
}

function update(dt) {
    if (gameOver || !started) return;

    elapsed += dt;

    if (elapsed >= GAME_LENGTH) {
        elapsed = GAME_LENGTH;
        finishGame(true);
        return;
    }

    const difficulty = Math.min(elapsed / GAME_LENGTH, 1);
    const boosted = boostTimer > 0;

    boostTimer = Math.max(0, boostTimer - dt);
    flash = Math.max(0, flash - dt);

    const moveSpeed = 150;

    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
        player -= moveSpeed * dt;
    }

    if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
        player += moveSpeed * dt;
    }

    player = Math.max(0, Math.min(136, player));

    const spawnInterval = Math.max(
        0.32,
        0.95 - difficulty * 0.52 - (boosted ? 0.18 : 0)
    );

    spawnTimer += dt;

    while (spawnTimer >= spawnInterval) {
        spawnTimer -= spawnInterval;
        spawnCandy();

        if (difficulty > 0.55 && Math.random() < 0.25) {
            spawnCandy();
        }
    }

    const fallSpeed = 48 + difficulty * 48;

    for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];

        item.y += fallSpeed * (boosted ? 1.15 : 1) * dt;

        if (
            item.y >= 200 &&
            item.x + 10 >= player &&
            item.x <= player + 24
        ) {
            if (item.powerup) {
                boostTimer = 6;
                flash = 0.6;
            } else if (item.poison) {
                combo = 0;
                misses++;
            } else {
                combo++;
                bestCombo = Math.max(bestCombo, combo);

                score += boosted ? 2 : 1;

                if (combo % 5 === 0) {
                    score += 5;
                    flash = 0.4;
                }
            }

            items.splice(i, 1);
        } else if (item.y > 240) {
            if (!item.poison && !item.powerup) {
                misses++;
                combo = 0;
            }

            items.splice(i, 1);
        }

        if (misses >= MAX_MISSES) {
            finishGame(false);
            break;
        }
    }
}

function draw() {
    background();

    for (let item of items) {
        drawItem(item);
    }

    drawPlayer();

    ctx.fillStyle = "white";
    ctx.font = "8px monospace";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + score, 4, 12);
    ctx.fillText("MISSES " + misses + "/" + MAX_MISSES, 94, 12);

    ctx.fillStyle = "#332044";
    ctx.fillRect(4, 17, 152, 3);

    ctx.fillStyle = "#ff9b35";
    ctx.fillRect(4, 17, 152 * (elapsed / GAME_LENGTH), 3);

    ctx.fillStyle = "#ffd700";
    ctx.fillText("COMBO " + combo, 4, 31);

    ctx.fillStyle = "white";
    ctx.fillText("TIME " + Math.ceil(GAME_LENGTH - elapsed), 112, 31);

    if (boostTimer > 0) {
        ctx.fillStyle = "#ffd700";
        ctx.fillText("2X ACTIVE!", 54, 43);
    }

    if (!started && !gameOver) {
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 11px monospace";
        ctx.fillText("CANDY CATCH", 80, 105);
        ctx.font = "8px monospace";
        ctx.fillText("CLICK OR SPACE TO START", 80, 123);
        ctx.fillText("ARROWS / A-D TO MOVE", 80, 137);
        ctx.textAlign = "left";
    }

    if (gameOver) {
        ctx.fillStyle = "rgba(8,3,15,0.88)";
        ctx.fillRect(0, 0, 160, 240);

        ctx.textAlign = "center";

        ctx.fillStyle = won ? "#ffd700" : "#ff2255";
        ctx.font = "bold 15px monospace";
        ctx.fillText(won ? "LEVEL CLEAR!" : "GAME OVER", 80, 85);

        ctx.fillStyle = "white";
        ctx.font = "9px monospace";
        ctx.fillText("SCORE: " + score, 80, 112);
        ctx.fillText("BEST COMBO: " + bestCombo, 80, 129);
        ctx.fillText("MISSES: " + misses, 80, 146);
        ctx.fillText("CLICK OR SPACE TO RESTART", 80, 174);

        ctx.textAlign = "left";
    }
}

function game(timestamp) {
    if (!lastFrame) lastFrame = timestamp;

    const dt = Math.min((timestamp - lastFrame) / 1000, 0.05);
    lastFrame = timestamp;

    update(dt);

    if (started && !gameOver) {
        updateLyrics();
    }

    draw();
    requestAnimationFrame(game);
}

game();
</script>

</body>
</html>
